<body>
    <header>
        <div class="logo-flex-box">
            <img class="logo" src="wwr-images/logo.jpg" alt="Logo">
        </div>
        <nav class="nav-links">
            <a href="index.html">index</a>
            <a href="about.html">about</a>
            <a href="trips.html">trips</a>
            <a href="contact.html">contact</a>
        </nav>
    </header>
    <main>
        <h1>Contact Us</h1>
        <h2>Meet the Team</h2>
            <div class = reviews>
                <figure>
                    <img src="wwr-images/staff1.jpg" alt="CEO">
                    <figcaption>CEO</figcaption>
                </figure>
                <figure>
                    <img src="wwr-images/staff2.jpg" alt="CFO">
                    <figcaption>CFO</figcaption>
                </figure>
                <figure>
                    <img src="wwr-images/staff3.jpg" alt="marketing">
                    <figcaption>marketing</figcaption>
                </figure>
                <figure>
                    <img src="wwr-images/staff4.jpg" alt="safety">
                    <figcaption>safety</figcaption>
                </figure>
            </div>
        <h3>Send us a message</h3>
        <p>Address: 1234 Somewhere Dr. Nowhere, MA 12345</p>
        <p>Phone: (123)000-0000</p>
        <p>Email: WhiteWaterRafting@WhiteWaterRafting.com</p>
        <iframe src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d188744.58110579354!2d-71.07966614603487!3d42.339664672006656!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1snowhere!5e0!3m2!1sen!2sus!4v1729302427912!5m2!1sen!2sus" width="400" height="300" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        <form>
            <fieldset>
                <legend>Contact Information</legend>
                    <label for="firstname">First name:</label>
                    <input type="text" id="firstname" name="firstname"><br>
                    <label for="lastname">Last name:</label>
                    <input type="text" id="lastname" name="lastname"><br>
                    <label for="useremail">Email address:</label>
                    <input type="email" id="useremail" name="useremail"><br>
                        <label for="generalinquiry">General Inquiry</label>
                        <input type="radio" id="generalinquiry" name="inquirytype"><br>
                        <label for="reservation">Reservation Question</label>
                        <input type="radio" id="reservation" name="inquirytype"><br>
                        <label for="suggestion">Website Suggestion</label>
                        <input type="radio" id="suggestion" name="inquirytype"><br>
                    <label for="message">Please enter your message:</label><br>   
                    <textarea name="message" id="message" rows="4" placeholder="Enter text here..."></textarea><br>   
                    <label for="subscription">Please subscribe me to the monthly newsletter</label>
                    <input type="checkbox" id="subscription" name="subscription"><br>              
            </fieldset>
            <button type="submit">Submit</button>
        </form>
    </main>
    <footer>
        <p class = "copywrite">&copy; 2024, White Water Rafting, Drew Jezek</p>
